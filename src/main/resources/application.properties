spring.application.name=loginabc

# MySQL - Agregamos el prefijo jdbc: antes de las variables
spring.datasource.url=jdbc:${DB_URL:${MYSQL_URL}}
spring.datasource.username=${DB_USER:${MYSQLUSER}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=${PORT:8080}
server.address=0.0.0.0