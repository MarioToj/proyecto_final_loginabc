spring.application.name=loginabc

# Conexión a MySQL en Railway (usando la variable pública o privada)
spring.datasource.url=jdbc:${DB_URL:${MYSQL_URL}}
spring.datasource.username=${DB_USER:${MYSQLUSER}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Red y Puerto para Railway
server.port=${PORT:8080}
server.address=0.0.0.0