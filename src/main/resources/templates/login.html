<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Seseión</title>
</head>
<body>
    <h1>Iniciar Seseión</h1>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <form th:action="@{/login}" th:object="${loginForm}" method="post">
        <div>
            <label for="correo">correo</label>
            <input type="text" id="correo" th:field="*{correo}">
            <span th:if="${#fields.hasErrors('correo')}" th:erorrs="*{correo}" style="color: red;"></span>
        </div>

        <div>
            <label for="password">password</label>
            <input type="text" id="password" th:field="*{password}">
            <span th:if="${#fields.hasErrors('password')}" th:erorrs="*{password}" style="color: red;"></span>
        </div>

        <button type="submit">entrar</button>
    </form>
</body>
</html>
