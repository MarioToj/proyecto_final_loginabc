<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="contenedor">
    <form class="formulario" th:action="@{/login}" th:object="${loginForm}" method="post">
        <h1>Iniciar sesión</h1>
        <p class="exito" th:if="${mensaje}" th:text="${mensaje}"></p>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <div>
            <label for="correo">Correo</label>
            <input type="text" id="correo" th:field="*{correo}">
            <span class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" th:field="*{password}">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <button class="boton" type="submit">Entrar</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
