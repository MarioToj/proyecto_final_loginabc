<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="contenedor">
    <section class="hero">
        <h1>Hola, <span th:text="${usuario.nombre}"></span></h1>
        <p class="subtitulo" th:if="${usuario.esEstudiante()}">Panel de estudiante</p>
        <p class="subtitulo" th:if="${usuario.esProfesor()}">Panel de profesor</p>
    </section>

    <div class="tarjetas">
        <article class="tarjeta">
            <h2 th:text="${usuario.esProfesor()} ? 'Cursos que impartes' : 'Tus cursos'"></h2>
            <p class="cifra" th:text="${totalCursos}"></p>
        </article>
        <article class="tarjeta">
            <h2 th:text="${usuario.esProfesor()} ? 'Actividades publicadas' : 'Actividades en tus cursos'"></h2>
            <p class="cifra" th:text="${totalActividades}"></p>
        </article>
    </div>

    <p>
        <a class="boton" th:href="@{/mis-cursos}"
           th:text="${usuario.esProfesor()} ? 'Gestionar mis cursos' : 'Ver mis cursos'"></a>
    </p>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
